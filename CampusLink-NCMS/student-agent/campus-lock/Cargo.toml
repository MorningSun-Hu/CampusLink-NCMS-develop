[package]
name = "campus-lock"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "campus-lock"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
eframe = "0.31"
egui = "0.31"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_Ime", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
