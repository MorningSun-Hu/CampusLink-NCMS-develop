[workspace]
members = ["agent-core", "campus-guard", "campus-lock", "campus-checkin"]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
prost = "0.12"
tokio-tungstenite = "0.21"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = "0.21"
hostname = "0.3"
mac_address = "1.0"
if-addrs = "0.15"
chrono = "0.4"
rand = "0.8"
sysinfo = "0.31"
