[package]
name = "teacher-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web 框架
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "postgres", "uuid", "chrono"] }
# SQLCipher 加密数据库: 编译时启用 --features sqlcipher 自动切换
# 需要环境中有 libsqlcipher 库

# 配置
config = "0.14"
dotenvy = "0.15"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# 工具
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
if-addrs = "0.15"

# 加密
bcrypt = "0.15"
jsonwebtoken = "9.3"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"

# Excel
calamine = "0.24"
rust_xlsxwriter = "0.77"

# Protobuf
prost = "0.12"
prost-types = "0.12"

# 通道
tokio-tungstenite = "0.21"
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json"] }

[features]
default = []
sqlcipher = []

[build-dependencies]
prost-build = "0.12"

[[bin]]
name = "teacher"
path = "src/main.rs"

[[bin]]
name = "stress-test"
path = "src/bin/stress_test.rs"
