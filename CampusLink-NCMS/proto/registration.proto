syntax = "proto3";

package campuslink.ncms.v1;

import "common.proto";

// 设备注册请求
message RegisterRequest {
    MessageMeta meta = 1;
    string device_code = 2;
    string machine_fingerprint = 3;
    string hostname = 4;
    string ip_address = 5;
    string mac_address = 6;
    string agent_version = 7;
}

// 设备注册响应
message RegisterResponse {
    MessageMeta meta = 1;
    AckCode code = 2;
    string message = 3;
    string device_id = 4;
    string teacher_fingerprint = 5;
    ModeType initial_mode = 6;
    uint32 heartbeat_interval_seconds = 7;
}
